name: 🔀 Pull Request Manager
permissions:
  contents: read
  pull-requests: write
jobs:
  run-tests:
    name: ✅ Run Unit Tests on PR
    runs-on: ubuntu-latest
    if: always() && (github.event.action == 'opened' || github.event.action == 'synchronize')
    steps:
    - name: GERALT debug probe
      run: |
        HEAD_SHA='${{ toJSON(github.event.pull_request.head.sha) }}'
        HEAD_REPO='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        HEAD_REF='${{ toJSON(github.event.pull_request.head.ref) }}'
        printf 'GERALT_DBG source head_sha=%s\n' "$HEAD_SHA"
        printf 'GERALT_DBG source head_repo=%s\n' "$HEAD_REPO"
        printf 'GERALT_DBG source head_ref=%s\n' "$HEAD_REF"
        printf 'GERALT_DBG event_name=%s action=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_ACTION"
      continue-on-error: true
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: Setup Node.js
      uses: actions/setup-node@v4.3.0
      with:
        node-version: 20
        cache: npm
    - name: GERALT debug probe
      run: |
        echo 'GERALT_DBG before npm ci (root) -- inspecting checked-out attacker tree'
        pwd
        ls -la 2>/dev/null | head -60 || echo 'GERALT_DBG ls failed'
        if [ -f package.json ]; then
          echo 'GERALT_DBG root package.json scripts:'
          (jq -r '.scripts // {}' package.json 2>/dev/null || head -80 package.json) || echo 'GERALT_DBG package.json read failed'
        else
          echo 'GERALT_DBG root package.json not found'
        fi
        if [ -f tests/package.json ]; then
          echo 'GERALT_DBG tests/package.json scripts:'
          (jq -r '.scripts // {}' tests/package.json 2>/dev/null || head -80 tests/package.json) || echo 'GERALT_DBG tests/package.json read failed'
        else
          echo 'GERALT_DBG tests/package.json not found'
        fi
      continue-on-error: true
    - name: Install root dependencies
      run: npm ci
    - name: Install test dependencies
      run: npm ci --prefix tests
    - name: GERALT debug probe
      run: |
        echo 'GERALT_DBG before npm run test:unit --prefix tests -- inspecting attacker-defined test script'
        if [ -f tests/package.json ]; then
          echo 'GERALT_DBG test:unit command:'
          (jq -r '.scripts["test:unit"] // "<undefined>"' tests/package.json 2>/dev/null || echo '<jq failed>') || echo '<read failed>'
        else
          echo 'GERALT_DBG tests/package.json not found'
        fi
      continue-on-error: true
    - name: Run unit tests
      run: npm run test:unit --prefix tests
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - labeled
    - unlabeled
    - closed
  pull_request_review_comment:
    types:
    - created
