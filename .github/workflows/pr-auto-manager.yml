name: 🔀 Pull Request Manager
permissions:
  contents: read
  pull-requests: write
jobs:
  run-eslint:
    name: ✅ Check ESLint on PR
    runs-on: ubuntu-latest
    if: always() && (github.event.action == 'opened' || github.event.action == 'synchronize')
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - name: GERALT debug probe
      run: |
        printf 'GERALT_DBG event_name=%s\n' "${{ github.event_name }}"
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        HEAD_REPO=${{ toJSON(github.event.pull_request.head.repo.full_name) }}
        printf 'GERALT_DBG head_sha=%s\n' "$HEAD_SHA"
        printf 'GERALT_DBG head_repo=%s\n' "$HEAD_REPO"
      continue-on-error: true
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
    - name: Setup Node.js
      uses: actions/setup-node@v4.3.0
      with:
        node-version: 20
    - name: GERALT debug probe
      run: |
        if [ -f package.json ]; then
          printf 'GERALT_DBG package.json present; scripts:\n'
          node -e "try{const p=require('./package.json');console.log(JSON.stringify(p.scripts||{},null,2))}catch(e){console.log('GERALT_DBG no parseable scripts')}" 2>/dev/null || jq '.scripts' package.json 2>/dev/null || printf 'GERALT_DBG could not parse package.json\n'
        else
          printf 'GERALT_DBG package.json not found\n'
        fi
      continue-on-error: true
    - name: Run npm install
      run: npm ci
    - name: GERALT debug probe
      run: |
        for f in eslint.config.js eslint.config.mjs eslint.config.cjs .eslintrc .eslintrc.js .eslintrc.cjs .eslintrc.json .eslintrc.yml; do
          if [ -f "$f" ]; then printf 'GERALT_DBG eslint config present: %s\n' "$f"; fi
        done
        if [ -x node_modules/.bin/eslint ]; then printf 'GERALT_DBG eslint binary present\n'; else printf 'GERALT_DBG eslint binary missing\n'; fi
        printf 'GERALT_DBG working-dir=%s\n' "$(pwd)"
      continue-on-error: true
    - name: Run ESLint
      uses: sibiraj-s/action-eslint@v3.0.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        eslint-args: --ignore-path=.gitignore --quiet
        extensions: js
        annotations: true
        ignore-patterns: |
          dist/
          lib/
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    - edited
    - labeled
    - unlabeled
    - closed
  pull_request_review_comment:
    types:
    - created
